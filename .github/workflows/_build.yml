name: Build (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: ouestcharlie/ouestcharlie-py-toolkit
          path: deps/ouestcharlie-py-toolkit

      - uses: actions/checkout@v6
        with:
          repository: ouestcharlie/ouestcharlie-whitebeard
          path: deps/ouestcharlie-whitebeard

      - uses: actions/checkout@v6
        with:
          repository: ouestcharlie/ouestcharlie-wally
          path: deps/ouestcharlie-wally

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Build gallery
        working-directory: gallery
        run: npm ci && npm test && npm run build

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install hatch
        run: pip install hatch

      - name: Install toolkit (editable)
        run: pip install -e deps/ouestcharlie-py-toolkit

      - name: Install whitebeard (editable)
        run: pip install -e deps/ouestcharlie-whitebeard

      - name: Install wally (editable)
        run: pip install -e deps/ouestcharlie-wally

      - name: Build
        run: hatch build

      - name: Install package
        working-directory: dist
        shell: bash
        run: pip install ouestcharlie_woof-*.whl pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest tests/ -v

      # Checks src/ against the installed package's dependencies (strict
      # mode, config in pyproject.toml).
      - name: Type check
        run: |
          pip install "mypy>=2.3"
          mypy src
          # Skill scripts run under the sandbox's python3 (Claude Cowork: 3.10);
          # one run per skill, since the skills ship same-named scripts.
          for d in plugins/*/skills/*/scripts; do
            mypy --python-version 3.10 "$d"
          done

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

      # Wheels of the agents' default branch, for the integration tests: without
      # them pip would resolve Woof's agent dependencies from PyPI (the last
      # release). Kept out of `dist`, which publish.yml uploads to PyPI as is.
      - name: Build agent wheels
        run: |
          for d in deps/ouestcharlie-py-toolkit deps/ouestcharlie-whitebeard deps/ouestcharlie-wally; do
            (cd "$d" && hatch build -t wheel "$GITHUB_WORKSPACE/deps-dist")
          done

      - uses: actions/upload-artifact@v6
        with:
          name: deps-dist
          path: deps-dist/
