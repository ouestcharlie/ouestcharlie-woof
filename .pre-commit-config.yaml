repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: eslint
        name: ESLint (gallery)
        entry: bash -c 'cd gallery && npm run lint'
        language: system
        files: ^gallery/src/.*\.(js|svelte)$
        pass_filenames: false
      # Runs in the project venv (uv sync first): strict mode needs the real
      # dependencies, which an isolated mirrors-mypy environment would lack.
      # --no-sync: never re-sync (or rebuild) the venv from a commit hook.
      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy src
        language: system
        files: ^src/.*\.py$
        pass_filenames: false
      # Skill scripts run under the sandbox's own python3 (Claude Cowork: 3.10),
      # so they're checked for 3.10. One run per skill: the skills ship
      # same-named scripts, which mypy rejects in a single run.
      - id: mypy-skill-scripts
        name: mypy (skill scripts, Python 3.10)
        entry: >-
          bash -c 'for d in plugins/*/skills/*/scripts; do
          uv run --no-sync mypy --python-version 3.10 "$d" || exit 1; done'
        language: system
        files: ^plugins/.*\.py$
        pass_filenames: false
